<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 p-8 bg-white border border-gray-200 rounded-xl shadow-sm">
   <div class="flex justify-center items-center">
    <img src="/logo.png" alt="SLCMC Logo" class="h-30 w-auto object-contain mb-4">
</div>

    <div class="text-center">

      <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Password Recovery</h2>
     
    </div>

    <div *ngIf="currentStep() === 'request'" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700"> Email Address</label>
        <input type="email" [(ngModel)]="emailInput" placeholder=""
               class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-cyan-500 focus:border-cyan-500">
      </div>
      <button (click)="sendResetLink()" 
              class="w-full flex justify-center py-2.5 px-4 rounded-lg text-white font-medium bg-blue-500 hover:bg-cyan-700= focus:outline-none transition-colors duration-150">
       Request Pasword
      </button>
    </div>

    <div *ngIf="currentStep() === 'reset'" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700">Enter Token Received</label>
        <input type="text" [(ngModel)]="resetForm.token" placeholder=""
               class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-cyan-500 focus:border-cyan-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Enter New Password </label>
        <input type="password" [(ngModel)]="resetForm.newPassword" placeholder=""
               class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-cyan-500 focus:border-cyan-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Confirm Password </label>
        <input type="password" [(ngModel)]="resetForm.confirmPassword" placeholder=""
               class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-cyan-500 focus:border-cyan-500">
      </div>

      <div class="flex gap-3 pt-2">
        <button (click)="currentStep.set('request')" 
                class="w-1/3 py-2.5 px-4 rounded-lg text-gray-700 font-medium bg-gray-100 hover:bg-gray-200 transition-colors">
          Back
        </button>
        <button (click)="executePasswordReset()" 
                class="w-2/3 py-2.5 px-4 rounded-lg text-white font-medium bg-blue-500 hover:bg-emerald-700 transition-colors">
          Update Password
        </button>
      </div>
    </div>

  </div>
</div>
