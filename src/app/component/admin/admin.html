<div class="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans">

  <nav class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-6 sticky top-0 z-50 shadow-sm shrink-0">
    <div class="flex items-center space-x-3">
      <button type="button" (click)="toggleSidebar()" class="p-2 -ml-2 rounded-xl text-slate-600 hover:bg-slate-100 md:hidden transition-colors focus:outline-none" aria-label="Toggle Menu">
        <fa-icon [icon]="isSidebarOpen ? faXmark : faBars" class="text-xl w-5 h-5 flex items-center justify-center"></fa-icon>
      </button>
      
      <img src="/logo.png" alt="SLCMC Logo" class="h-10 md:h-11 w-auto object-contain">
      
      <div class="flex flex-col">
        <h1 class="text-xs md:text-sm font-black text-fuchsia-700 uppercase leading-none tracking-tight">Sister Leonella Consolata</h1>
        <span class="text-[9px] md:text-[10px] font-bold text-cyan-600 tracking-wider uppercase mt-0.5">Admin Management</span>
      </div>
    </div>

    
  </nav>

  <div class="flex flex-1 min-h-0 w-full relative">
    
    <div *ngIf="isSidebarOpen" (click)="closeSidebar()" class="fixed inset-0 bg-slate-900/40 z-30 md:hidden backdrop-blur-sm transition-opacity duration-300"></div>

    <aside [class.translate-x-0]="isSidebarOpen" [class.-translate-x-full]="!isSidebarOpen" class="fixed inset-y-0 left-0 pt-16 md:pt-0 w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0 shadow-xl z-40 transform md:transform-none md:relative transition-transform duration-300 ease-in-out md:translate-x-0">
      
      <nav class="p-4 space-y-1.5 flex-1">
        
        <a (click)="setActivePage('dashboard')" 
           [class.bg-cyan-600]="activePage === 'dashboard'" 
           [class.text-white]="activePage === 'dashboard'" 
           [class.shadow-md]="activePage === 'dashboard'"
           class="flex items-center space-x-3 px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 group cursor-pointer hover:bg-slate-800 hover:text-white">
          <fa-icon [icon]="faChartPie" [class.text-cyan-400]="activePage !== 'dashboard'" class="text-base transition-colors group-hover:text-white"></fa-icon>
          <span>Dashboard</span>
        </a>

        <a (click)="setActivePage('programs')" 
           [class.bg-cyan-600]="activePage === 'programs'" 
           [class.text-white]="activePage === 'programs'" 
           [class.shadow-md]="activePage === 'programs'"
           class="flex items-center space-x-3 px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 group cursor-pointer hover:bg-slate-800 hover:text-white">
          <fa-icon [icon]="faGraduationCap" [class.text-cyan-400]="activePage !== 'programs'" class="text-base transition-colors group-hover:text-white"></fa-icon>
          <span>Programs & Cohorts</span>
        </a>

      </nav>

      <div class="p-4 border-t border-slate-800 bg-slate-950/40">
        <button class="w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold px-4 py-2.5 rounded-xl transition-colors text-sm flex items-center justify-center space-x-2 shadow-sm shadow-rose-900/20" (click)="logout()">
          <fa-icon [icon]="faSignOutAlt"></fa-icon>
          <span>Log Out</span>
        </button>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      
      <main class="flex-1 p-4 md:p-6 overflow-y-auto bg-slate-50">
        <div class="max-w-7xl mx-auto">
          <app-dashboard *ngIf="activePage === 'dashboard'"></app-dashboard>
          <app-programs *ngIf="activePage === 'programs'"></app-programs>
        </div>
      </main>

      <footer class="bg-white border-t border-slate-200 py-3 px-6 text-center w-full shrink-0">
        <p class="text-[11px] md:text-xs text-slate-500 font-medium">
          &copy; 2026 <span class="text-fuchsia-700 font-bold uppercase tracking-wide">Sister Leonella Consolata Medical College</span>. All Rights Reserved.
        </p>
      </footer>

    </div>

  </div>
</div>
