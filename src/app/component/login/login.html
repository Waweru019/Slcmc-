<div class="min-h-screen w-full flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white rounded-2xl border border-slate-100 shadow-xl overflow-hidden transition-all duration-300">
    <div class="p-8 sm:p-10">
      
      <div class="flex flex-col items-center text-center mb-8">
        <img src="/logo.png" alt="SLCMC Logo" class="h-20 w-auto object-contain mb-4">
        <div>
          <span class="block text-[11px] font-black uppercase tracking-widest text-cyan-600 mb-1">
            Welcome back Alumni
          </span>
          <h2 class="text-2xl font-black text-slate-900 tracking-tight uppercase">
            Alumni Login
          </h2>
        </div>
      </div>
<div *ngIf="errorMessage()" class="flex items-center gap-2 bg-rose-50 border border-rose-100 text-rose-700 p-3 rounded-xl mb-6 font-semibold text-xs animate-shake" role="alert">
  
  <span>{{ errorMessage() }}</span>
</div>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">
            Email Address
          </label>
          <input 
            type="email" 
            placeholder="Enter your email address" 
            formControlName="email" 
            class="w-full px-4 py-3 text-sm bg-slate-50 hover:bg-slate-100/70 focus:bg-white rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-150"
          >
          
          <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)" class="text-rose-600 text-xs font-medium mt-1.5 flex flex-col gap-1">
            <span *ngIf="loginForm.get('email')?.hasError('required')">Email is required.</span>
            <span *ngIf="loginForm.get('email')?.hasError('email')">Please enter a valid email address.</span>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">
            Password
          </label>
          <input 
            type="password" 
            formControlName="password" 
            placeholder="••••••••" 
            class="w-full px-4 py-3 text-sm bg-slate-50 hover:bg-slate-100/70 focus:bg-white rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all duration-150"
          >
          
          <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" class="text-rose-600 text-xs font-medium mt-1.5 flex items-center gap-1">
            <span *ngIf="loginForm.get('password')?.hasError('required')">Password is required.</span>
          </div>
        </div>

        <div class="flex justify-end">
          <a class="text-xs font-bold text-blue-600 hover:text-blue-700 hover:underline transition" routerLink="/resetpassword">
            Forgot Password?
          </a>
        </div>

        <button 
          type="submit" 
          [disabled]="isSubmitting" 
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed text-white py-3 px-4 rounded-xl font-bold text-sm shadow-sm transition-all duration-150 active:scale-[0.99] flex items-center justify-center gap-2"
        >
          <svg *ngIf="isSubmitting" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Sign In
        </button>

        <p class="text-center text-xs text-slate-500 mt-6">
          Don't have an account? 
          <a class="font-bold text-rose-600 hover:text-rose-700 hover:underline ms-1 transition" routerLink="/register">Register</a>
        </p>
        
      </form>

    </div>
  </div>
</div>
