<div class="flex min-h-[75vh] items-center justify-center px-4 sm:px-6 lg:px-8 font-sans">
  <div class="w-full max-w-md space-y-6 rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    
    <!-- Header Area -->
    <div class="text-center">
      <h2 class="text-2xl font-bold tracking-tight text-cyan-600">
        Verify Your Account
      </h2>
      <p class="mt-2 text-sm text-slate-500 leading-relaxed">
        We sent a 6-digit verification code to your registered email address. 
        Please enter it below to complete your registration.
      </p>
    </div>

    <!-- Single OTP Field -->
    <div class="py-2">
      <input 
        type="text" 
        maxLength="6" 
        pattern="[0-9]*"
        inputmode="numeric"
        placeholder="000000"
        [(ngModel)]="otpCode"
        (input)="onOtpInput($event)"
        autocomplete="one-time-code"
        autofocus
        class="h-14 w-full rounded-xl border-2 border-slate-200 text-center text-3xl font-mono font-bold tracking-[0.5em] text-slate-800 outline-none transition-all duration-200 focus:border-cyan-600 focus:ring-4 focus:ring-cyan-100 placeholder:tracking-normal placeholder:font-sans placeholder:text-xl placeholder:text-slate-300"
      />
    </div>

    <!-- Action Button -->
    <button 
      (click)="submitOtp()"
      class="flex w-full justify-center rounded-xl bg-cyan-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition-colors duration-150 hover:bg-cyan-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-600"
    >
      Verify Code
    </button>

    <!-- Context Cooldown Timer Section -->
    <div class="text-center text-sm text-slate-500 pt-2 border-t border-slate-100">
      <p *ngIf="!canResend" class="font-medium">
        Resend code in: <span class="text-slate-800 font-mono font-bold">{{ formatTime(timeLeft) }}</span>
      </p>
      
      <button 
        *ngIf="canResend" 
        (click)="resendOtp()"
        class="font-semibold text-cyan-600 hover:text-cyan-700 hover:underline focus:outline-none transition-colors"
      >
        Resend Verification Code
      </button>
    </div>

    <!-- Back to Register Utility Link -->
    <div class="text-center">
      <a routerLink="/register" class="text-xs font-medium text-slate-400 hover:text-slate-600 transition-colors">
        ← Back to Registration panel
      </a>
    </div>

  </div>
</div>
